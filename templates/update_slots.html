<!DOCTYPE html>
<html>
<head>
    <link
rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}"
>
    <title>Update Slots</title>
</head>
<body>

<h2>Update Slots</h2>

<h3>{{ trek.trek_name }}</h3>

<form method="POST">

    <label>Available Slots</label>

    <input
        type="number"
        name="available_slots"
        value="{{ trek.available_slots }}"
        required>

    <br><br>

    <button type="submit">
        Update Slots
    </button>

</form>

</body>
</html>
