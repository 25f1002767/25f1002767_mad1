<!DOCTYPE html>
<html>
<head>
    <title>Edit Trek</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h2>Edit Trek</h2>

<form method="POST">

    <label>Trek Name:</label>
    <input
        type="text"
        name="trek_name"
        value="{{ trek.trek_name }}"
        required>

    <br><br>

    <label>Location:</label>
    <input
        type="text"
        name="location"
        value="{{ trek.location }}"
        required>

    <br><br>

    <label>Difficulty:</label>
    <input
        type="text"
        name="difficulty"
        value="{{ trek.difficulty }}"
        required>

    <br><br>

    <label>Duration (Days):</label>
    <input
        type="number"
        name="duration_days"
        value="{{ trek.duration_days }}"
        min="1"
        required>

    <br><br>

    <label>Available Slots:</label>
    <input
        type="number"
        name="available_slots"
        value="{{ trek.available_slots }}"
        min="1"
        required>

    <br><br>

    <button type="submit">
        Update Trek
    </button>

</form>

</body>
</html>
