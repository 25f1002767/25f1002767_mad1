<h2>Edit Trek</h2>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<form method="POST">

    <input
        type="text"
        name="trek_name"
        value="{{ trek.trek_name }}"
        required
    >

    <br><br>

    <input
        type="text"
        name="location"
        value="{{ trek.location }}"
        required
    >

    <br><br>

    <input
        type="text"
        name="difficulty"
        value="{{ trek.difficulty }}"
        required
    >

    <br><br>

    <input
        type="number"
        name="duration_days"
        value="{{ trek.duration_days }}"
        required
    >

    <br><br>

    <input
        type="number"
        name="available_slots"
        value="{{ trek.available_slots }}"
        required
    >

    <br><br>

    <button type="submit">
        Update Trek
    </button>

</form>
