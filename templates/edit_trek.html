<h2>Edit Trek</h2>

<form method="POST">

    <input
        type="text"
        name="trek_name"
        value="{{ trek.trek_name }}"
        required
    >

    <br><br>

    <input
        type="text"
        name="location"
        value="{{ trek.location }}"
        required
    >

    <br><br>

    <input
        type="text"
        name="difficulty"
        value="{{ trek.difficulty }}"
        required
    >

    <br><br>

    <input
        type="number"
        name="duration_days"
        value="{{ trek.duration_days }}"
        required
    >

    <br><br>

    <input
        type="number"
        name="available_slots"
        value="{{ trek.available_slots }}"
        required
    >

    <br><br>

    <button type="submit">
        Update Trek
    </button>

</form>
