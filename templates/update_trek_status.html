<!DOCTYPE html>
<html>
<head>
    <title>Update Trek Status</title>
</head>
<body>

<h2>Update Trek Status</h2>

<h3>{{ trek.trek_name }}</h3>
<p>Current Status: {{ trek.status }}</p>

<form method="POST">

    <label>Status</label>

    <select name="status">

    <option value="Pending">Pending</option>

    <option value="Approved">Approved</option>

    <option value="Open">Open</option>

    <option value="Closed">Closed</option>

    <option value="Completed">Completed</option>

</select>


    <br><br>

    <button type="submit">
        Update Status
    </button>

</form>

</body>
</html>
