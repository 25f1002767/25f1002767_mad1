<!DOCTYPE html>
<html>
<head>
    <title>Update Profile</title>
</head>
<body>

<h2>Update Profile</h2>

<form method="POST">

    <label>Contact Number</label>

    <input
        type="text"
        name="contact_number"
        value="{{ staff.contact_number }}"
        required>

    <br><br>

    <label>Experience Years</label>

    <input
        type="number"
        name="experience_years"
        value="{{ staff.experience_years }}"
        required>

    <br><br>

    <button type="submit">
        Update Profile
    </button>

</form>

</body>
</html>
