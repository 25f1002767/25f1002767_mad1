<!DOCTYPE html>
<html>
<head>
    <title>Create Trek</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h2>Create Trek</h2>

<form method="POST">

    <input type="text"
           name="trek_name"
           placeholder="Trek Name"
           required>

    <br><br>

    <input type="text"
           name="location"
           placeholder="Location"
           required>

    <br><br>

    <input type="text"
           name="difficulty"
           placeholder="Difficulty"
           required>

    <br><br>

    <input type="number"
           name="duration_days"
           min="1"
           placeholder="Duration (Days)"
           required>

    <br><br>

    <input type="number"
           name="available_slots"
           min="1"
           placeholder="Available Slots"
           required>

    <br><br>

    <label>Start Date:</label>
    <input type="date"
           name="start_date"
           required>

    <br><br>

    <label>End Date:</label>
    <input type="date"
           name="end_date"
           required>

    <br><br>

    <textarea
        name="description"
        placeholder="Description">
    </textarea>

    <br><br>

    <button type="submit">
        Create Trek
    </button>

</form>

</body>
</html>
