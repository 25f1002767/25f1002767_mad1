<h2>Create Trek</h2>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<form method="POST">

    <input
        type="text"
        name="trek_name"
        placeholder="Trek Name"
        required
    >

    <br><br>

    <input
        type="text"
        name="location"
        placeholder="Location"
        required
    >

    <br><br>

    <input
        type="text"
        name="difficulty"
        placeholder="Difficulty"
        required
    >

    <br><br>

    <input
        type="number"
        name="duration_days"
        min = "1"
        placeholder="Duration Days"
        required
    >

    <br><br>

    <input
        type="number"
        name="available_slots"
            min="1"

        placeholder="Available Slots"
        required
    >

    <br><br>

    <input
        type="date"
        name="start_date"
        required
    >

    <br><br>

    <input
        type="date"
        name="end_date"
        required
    >

    <br><br>

    <textarea
        name="description"
        placeholder="Description"
    ></textarea>

    <br><br>

    <button type="submit">
        Create Trek
    </button>

</form>
