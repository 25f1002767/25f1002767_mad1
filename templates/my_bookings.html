<h2>My Bookings</h2>

<table border="1">

    <tr>
        <th>Booking ID</th>
        <th>Trek ID</th>
        <th>Status</th>
        <th>Payment</th>
        <th>Action</th>
    </tr>

    {% for booking in bookings %}

    <tr>

        <td>{{ booking.id }}</td>
        <td>{{ booking.trek.trek_name }}</td>
        <td>{{ booking.booking_status }}</td>
        <td>{{ booking.payment_status }}</td>
        <td>
            <a href="/cancel-booking/{{ booking.id }}">
                Cancel Booking
            </a>
        </td>
        

    </tr>


    {% endfor %}

</table>
