<!DOCTYPE html>
<html>

<head>

    <title>Trek History</title>

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <h2>Completed Treks</h2>

    <table>

        <tr>
            <th>Booking ID</th>
            <th>Trek Name</th>
            <th>Location</th>
            <th>Difficulty</th>
            <th>Booking Date</th>
        </tr>

        {% for booking in history %}

        <tr>

            <td>{{ booking.id }}</td>

            <td>{{ booking.trek.trek_name }}</td>

            <td>{{ booking.trek.location }}</td>

            <td>{{ booking.trek.difficulty }}</td>

            <td>{{ booking.booking_date }}</td>

        </tr>

        {% endfor %}

    </table>

</body>

</html>
