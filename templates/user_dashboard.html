<h2>Available Treks</h2>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<canvas id="userChart" width="400" height="200"></canvas>
<script>

new Chart(
document.getElementById('userChart'),
{
    type: 'pie',

    data: {

        labels: {{ booking_labels|tojson }},

        datasets: [{
            data: {{ booking_data|tojson }}
        }]
    }
});

</script>
<a href="/my-bookings">My Bookings</a>
<a href="/trek-history">Trek History</a>
<br><br>
<form method="GET">

    <input
        type="text"
        name="location"
        placeholder="Search Location">

    <select name="difficulty">

        <option value="">
            All Difficulties
        </option>

        <option value="Easy">
            Easy
        </option>

        <option value="Medium">
            Medium
        </option>

        <option value="Hard">
            Hard
        </option>

    </select>

    <button type="submit">
        Search
    </button>

</form>

<br><hr><br>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Trek Name</th>
        <th>Location</th>
        <th>Difficulty</th>
        <th>Slots</th>
        <th>Action</th>
    </tr>

    {% for trek in treks %}

    <tr>

        <td>{{ trek.id }}</td>
        <td>{{ trek.trek_name }}</td>
        <td>{{ trek.location }}</td>
        <td>{{ trek.difficulty }}</td>
        <td>{{ trek.available_slots }}</td>

        <td>
            <a href="/book-trek/{{ trek.id }}">
                Book Trek
            </a>
                <a href="/user/profile">
               Update Profile
            </a>

<br><br>
        </td>

    </tr>

    {% endfor %}

</table>
