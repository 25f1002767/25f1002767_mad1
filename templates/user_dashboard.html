<!DOCTYPE html>
<html>

<head>

    <title>User Dashboard</title>

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <h1>User Dashboard</h1>

    <a href="/my-bookings">
        My Bookings
    </a>

    |

    <a href="/trek-history">
        Trek History
    </a>

    |

    <a href="/user/profile">
        Update Profile
    </a>

    <br><br>

    <h3>Search Treks</h3>

    <form method="GET">

        <input
            type="text"
            name="location"
            placeholder="Search Location">

        <select name="difficulty">

            <option value="">
                All Difficulties
            </option>

            <option value="Easy">
                Easy
            </option>

            <option value="Medium">
                Medium
            </option>

            <option value="Hard">
                Hard
            </option>

        </select>

        <button type="submit">
            Search
        </button>

    </form>

    <br>

    <table>

        <tr>
            <th>ID</th>
            <th>Trek Name</th>
            <th>Location</th>
            <th>Difficulty</th>
            <th>Slots</th>
            <th>Action</th>
        </tr>

        {% for trek in treks %}

        <tr>

            <td>{{ trek.id }}</td>
            <td>{{ trek.trek_name }}</td>
            <td>{{ trek.location }}</td>
            <td>{{ trek.difficulty }}</td>
            <td>{{ trek.available_slots }}</td>

            <td>

                <a href="/book-trek/{{ trek.id }}">
                    Book Trek
                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

</body>

</html>
