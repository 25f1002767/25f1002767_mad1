<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-light">

<div class="container mt-4">

    <h1 class="text-center mb-4">
        User Dashboard
    </h1>

    <div class="card shadow p-3 mb-4">

        <h4 class="text-center">
            Booking Statistics
        </h4>

        <div style="width:500px; height:300px; margin:auto;">
            <canvas id="userChart"></canvas>
        </div>

    </div>

    <div class="mb-4">

        <a href="/my-bookings"
           class="btn btn-primary">
           My Bookings
        </a>

        <a href="/trek-history"
           class="btn btn-success">
           Trek History
        </a>

        <a href="/user/profile"
           class="btn btn-info">
           Update Profile
        </a>

    </div>

    <div class="card shadow p-3 mb-4">

        <h4>Search Treks</h4>

        <form method="GET" class="row g-3">

            <div class="col-md-5">
                <input
                    type="text"
                    name="location"
                    class="form-control"
                    placeholder="Search Location">
            </div>

            <div class="col-md-4">
                <select
                    name="difficulty"
                    class="form-select">

                    <option value="">
                        All Difficulties
                    </option>

                    <option value="Easy">
                        Easy
                    </option>

                    <option value="Medium">
                        Medium
                    </option>

                    <option value="Hard">
                        Hard
                    </option>

                </select>
            </div>

            <div class="col-md-3">
                <button
                    type="submit"
                    class="btn btn-primary w-100">
                    Search
                </button>
            </div>

        </form>

    </div>

    <div class="table-responsive">

        <table class="table table-bordered table-striped">

            <tr>
                <th>ID</th>
                <th>Trek Name</th>
                <th>Location</th>
                <th>Difficulty</th>
                <th>Slots</th>
                <th>Action</th>
            </tr>

            {% for trek in treks %}

            <tr>

                <td>{{ trek.id }}</td>
                <td>{{ trek.trek_name }}</td>
                <td>{{ trek.location }}</td>
                <td>{{ trek.difficulty }}</td>
                <td>{{ trek.available_slots }}</td>

                <td>

                    <a href="/book-trek/{{ trek.id }}"
                       class="btn btn-success btn-sm">
                       Book Trek
                    </a>

                </td>

            </tr>

            {% endfor %}

        </table>

    </div>

</div>

<script>

new Chart(
document.getElementById('userChart'),
{
    type: 'pie',

    data: {

        labels: {{ booking_labels|tojson }},

        datasets: [{
            data: {{ booking_data|tojson }}
        }]
    }
});

</script>

</body>
</html>
