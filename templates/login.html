<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login Form</title>

    <link rel="stylesheet" href="/static/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body>

    <div id="main">
        <div id="canvas">

            <div id="form-body">

                <h2>Login Form</h2>

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Email</label>

                        <input
                            type="email"
                            class="form-control"
                            name="email"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>

                        <input
                            type="password"
                            class="form-control"
                            name="password"
                            required>
                    </div>

                    <div class="text-center">

                        <input
                            type="submit"
                            class="btn btn-primary"
                            value="Login">

                        <br><br>

                        Are you a new user?
                        <a href="/register">Register</a>

                    </div>

                </form>

            </div>

        </div>
    </div>

</body>
</html>
