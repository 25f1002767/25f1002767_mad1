<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <h2>Trekking Management Registration</h2>

    <form method="POST" action="/register">

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            required>

        <br><br>

        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            required>

        <br><br>

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required>

        <br><br>

        <label>
            Register As
        </label>

        <select
            name="role"
            required>

            <option value="">
                Select Role
            </option>

            <option value="user">
                Trekker
            </option>

            <option value="staff">
                Trek Staff
            </option>

        </select>

        <br><br>

        <label>
            Contact Number
        </label>

        <input
            type="text"
            name="contact_number"
            pattern="[0-9]{10}">

        <br><br>

        <label>
            Experience (Years)
        </label>

        <input
            type="number"
            name="experience_years"
            min="0">

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

    <hr>

    <p>

        Already have an account?

        <a href="/login">
            Login Here
        </a>

    </p>

</body>

</html>
