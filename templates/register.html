<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-4">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Trekking Management Registration
                    </h2>

                    <form method="POST" action="/register">

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="username"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                name="email"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                name="password"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Register As
                            </label>

                            <select
                                class="form-select"
                                name="role"
                                required>

                                <option value="">
                                    Select Role
                                </option>

                                <option value="user">
                                    Trekker
                                </option>

                                <option value="staff">
                                    Trek Staff
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Contact Number
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="contact_number"
                                pattern="[0-9]{10}">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Experience (Years)
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                name="experience_years"
                                min="0">

                        </div>

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-success">

                                Register

                            </button>

                        </div>

                    </form>

                    <hr>

                    <p class="text-center">

                        Already have an account?

                        <a href="/login">
                            Login Here
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
