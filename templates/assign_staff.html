<!DOCTYPE html>
<html>
<head>
    <title>Assign Staff</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h2>Assign Staff</h2>

<p>
    Trek Name: {{ trek.trek_name }}
</p>

<form method="POST">

    <label>Select Staff:</label>

    <select name="staff_id" required>

        {% for staff in approved_staff %}

        <option value="{{ staff.id }}">
            {{ staff.user.username }}
        </option>

        {% endfor %}

    </select>

    <br><br>

    <button type="submit">
        Assign Staff
    </button>

</form>

</body>
</html>
