<h2>All Bookings</h2>

<table border="1">

    <tr>
        <th>Booking ID</th>
        <th>User ID</th>
        <th>Trek ID</th>
        <th>Status</th>
        <th>Payment</th>
    </tr>

    {% for booking in bookings %}

    <tr>
        <td>{{ booking.id }}</td>
        <td>{{ booking.user_id }}</td>
        <td>{{ booking.trek_id }}</td>
        <td>{{ booking.booking_status }}</td>
        <td>{{ booking.payment_status }}</td>
    </tr>

    {% endfor %}

</table>
