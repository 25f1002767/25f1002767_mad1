<!DOCTYPE html>
<html>

<head>

    <title>Pending Staff Approvals</title>

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <h2>Pending Staff Approvals</h2>

    <table>

        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Contact</th>
            <th>Experience</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

        {% for staff in pending_staff %}

        <tr>

            <td>{{ staff.user.username }}</td>

            <td>{{ staff.user.email }}</td>

            <td>{{ staff.contact_number }}</td>

            <td>{{ staff.experience_years }}</td>

            <td>{{ staff.approval_status }}</td>

            <td>

                <a href="/approve/{{ staff.id }}">
                    Approve
                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

</body>

</html>
