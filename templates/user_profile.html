<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
</head>
<body>

<h2>Update Profile</h2>

<form method="POST">

    <label>Username</label>

    <input
        type="text"
        name="username"
        value="{{ user.username }}"
        required>

    <br><br>

    <label>Email</label>

    <input
        type="email"
        name="email"
        value="{{ user.email }}"
        required>

    <br><br>

    <button type="submit">
        Update Profile
    </button>

</form>

</body>
</html>
