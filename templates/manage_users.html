<!DOCTYPE html>
<html>

<head>
    <title>Manage Users</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h2>Manage Users</h2>

    <form method="GET">

        <input
            type="text"
            name="search"
            placeholder="Search Username or Email">

        <button type="submit">
            Search
        </button>

    </form>

    <br>

    <table>

        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Actions</th>
        </tr>

        {% for user in users %}

        <tr>

            <td>{{ user.id }}</td>

            <td>{{ user.username }}</td>

            <td>{{ user.email }}</td>

            <td>{{ user.role }}</td>

            <td>

                <a href="/edit-user/{{ user.id }}">
                    Edit
                </a>

                |

                <a href="/delete-user/{{ user.id }}">
                    Delete
                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

    <br>

    
</body>

</html>
