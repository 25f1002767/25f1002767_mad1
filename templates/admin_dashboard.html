<!DOCTYPE html>
<html>

<head>
    <title>Admin Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>🏔️ Admin Dashboard</h1>

    <h3>Statistics</h3>

    <div class="stats">

        <div class="card">
            <h2>{{ total_users }}</h2>
            <p>Total Users</p>
        </div>

        <div class="card">
            <h2>{{ total_staff }}</h2>
            <p>Total Staff</p>
        </div>

        <div class="card">
            <h2>{{ total_treks }}</h2>
            <p>Total Treks</p>
        </div>

        <div class="card">
            <h2>{{ total_bookings }}</h2>
            <p>Total Bookings</p>
        </div>

        <div class="card">
            <h2>{{ active_users }}</h2>
            <p>Active Users</p>
        </div>

    </div>

    <h3>Admin Actions</h3>

    <p>
        <a class="action-btn" href="/admin/treks">
            Manage Treks
        </a>

        <a class="action-btn" href="/admin/users">
            Manage Users
        </a>

        <a class="action-btn" href="/admin/staff">
            Manage Staff
        </a>

        <a class="action-btn" href="/admin/bookings">
            View Bookings
        </a>

        <a class="action-btn" href="{{ url_for('pending_staff') }}">
            Pending Staff
        </a>

        <a class="action-btn" href="/logout">
            Logout
        </a>
    </p>

</body>

</html>
